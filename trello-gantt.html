<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trello 甘特圖</title>
<script>try{const p=localStorage.getItem('tg_theme')||'auto';document.documentElement.dataset.theme=p==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):p}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2630;--mute:#6b7785;--line:#e3e8ee;--acc:#1f6f78;--accon:#fff;--s2:#eef2f5;--hd:#fafbfc;--hov:#f1f7f8;--chip:#e6eef0;--grid:#eef1f4;--wk:rgba(0,0,0,.035);--inp:#fff;--cbg:#f6f8fa;--err:#b3261e;--ok:#1d7a46;--late:#c0392b;--bk:rgba(20,30,40,.4);color-scheme:light}
html[data-theme=dark]{--bg:#12171d;--card:#1a2129;--ink:#e6ebf0;--mute:#93a1b0;--line:#2b3540;--acc:#4fb3bf;--accon:#0d1a1d;--s2:#222c36;--hd:#1e262f;--hov:#243241;--chip:#2b3a46;--grid:#242d37;--wk:rgba(255,255,255,.04);--inp:#141a21;--cbg:#222b35;--err:#ff8a80;--ok:#6fd09a;--late:#ff6b5b;--bk:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{padding:20px 28px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:var(--mute)}
a{color:var(--acc)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:12px 28px;padding:12px 20px}
summary{cursor:pointer;font-weight:600;font-size:15px}summary .sm{font-weight:400;color:var(--mute);font-size:13px;margin-left:10px}
details[open]>summary{margin-bottom:12px}
.row2{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:4px}
label.ck{display:flex;align-items:center;gap:6px;padding-bottom:8px}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--inp);color:var(--ink)}
input[type=checkbox]{padding:0}
input[type=text],input[type=password]{width:260px}textarea{width:100%;min-height:64px;resize:vertical}
button{padding:8px 16px;border:0;border-radius:6px;background:var(--acc);color:var(--accon);font:inherit;cursor:pointer}
button.sec{background:var(--card);color:var(--acc);border:1px solid var(--acc)}
button.lk{background:none;color:var(--acc);padding:0 4px;text-decoration:underline}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #e8a33d;outline-offset:2px}
#boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 16px;margin-bottom:12px}
#boards label{display:flex;gap:8px;align-items:center}
.msg{color:var(--mute);margin-top:8px}.err{color:var(--err)}.ok{color:var(--ok)}
.bar-act{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--mute);margin:0 0 8px}
#gmsg{min-height:20px;margin:0 0 6px;font-size:13px}
#wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:6px;background:var(--card);user-select:none}
#wrap.exporting{overflow:visible;max-height:none}
#wrap.exporting .lab{position:static}
.g{display:inline-block;min-width:100%}
.r{display:flex;height:30px;border-bottom:1px solid var(--line)}
.lab{position:sticky;left:0;z-index:6;flex:none;width:380px;background:var(--card);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap}
.lab[data-i]{cursor:pointer}.lab[data-i]:hover{background:var(--hov)}
.lab .n{overflow:hidden;text-overflow:ellipsis;flex:1}
.mm{display:flex;gap:3px;max-width:190px;overflow:hidden;flex:none}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--chip);color:var(--ink);border-radius:10px;padding:0 7px;font-size:11px;white-space:nowrap}
.bd{background:var(--s2);font-weight:600}.bd .lab{background:var(--s2)}
label.lt{margin-left:auto;font-weight:400;font-size:12px;color:var(--mute);display:flex;gap:4px;align-items:center}
.lr{cursor:pointer}
.lr .lab{font-weight:600;font-size:13px;border-left:4px solid var(--bc)}
.cnt{flex:none;font-size:11px;font-weight:600;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.arr{flex:none;width:12px;color:var(--mute);font-size:11px}
.ltag{flex:none;font-size:10px;font-weight:600;color:#fff;background:var(--bc);border-radius:3px;padding:0 5px}
.cr .lab{padding-left:34px;border-left:4px solid var(--bt)}
.gp{flex:none;width:14px;margin-left:-20px;text-align:center;cursor:grab;color:var(--mute);touch-action:none;letter-spacing:-2px}
.lchip{flex:none;max-width:100px;overflow:hidden;text-overflow:ellipsis;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--mute)}
.hd{height:24px;background:var(--hd)}.hd .lab{background:var(--hd)}
.track{position:relative;flex:none}
.cell{position:absolute;top:0;height:100%;font-size:11px;color:var(--mute);text-align:center;border-left:1px solid var(--line);overflow:hidden;white-space:nowrap}
.wk{background:var(--wk)}
.bar{position:absolute;top:6px;height:18px;border-radius:4px;opacity:.95;min-width:6px;cursor:grab}
.bar::before,.bar::after{content:'';position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize}
.bar::before{left:0}.bar::after{right:0}
.bar.done{opacity:.4}.bar.late{outline:2px solid var(--late)}
.today{position:absolute;top:0;bottom:0;width:2px;background:#e8a33d;z-index:2;pointer-events:none}
.tbadge{position:absolute;top:0;z-index:5;transform:translateX(-50%);background:#e8a33d;color:#1c2630;font-size:11px;padding:0 8px;border-radius:0 0 4px 4px;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#tip{position:fixed;z-index:50;display:none;background:var(--ink);color:var(--card);font-size:12px;padding:2px 8px;border-radius:4px;pointer-events:none}
#dropline{position:fixed;z-index:49;height:3px;background:#e8a33d;border-radius:2px;display:none;pointer-events:none}
dialog{width:min(620px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:10px;padding:20px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:var(--bk)}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh b{font-size:17px}.x{background:none;color:var(--mute);padding:2px 8px;font-size:16px}
.sub{color:var(--mute);font-size:13px;margin:4px 0 14px}
dialog h3{font-size:14px;margin:18px 0 8px}
.desc{white-space:pre-wrap;word-break:break-word;background:var(--cbg);border-radius:6px;padding:8px 10px;max-height:180px;overflow:auto}
#cm{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.c{background:var(--cbg);border-radius:6px;padding:8px 10px}.ch{font-size:12px;color:var(--mute)}.ch b{color:var(--ink)}
.ct{white-space:pre-wrap;word-break:break-word;margin-top:2px}
</style>
</head>
<body>
<header>
  <div><h1>Trello 甘特圖</h1><p>選看板、篩選成員與卡片,直接在圖上拖曳調整日期,點卡片可管理成員、查看描述與留言,並匯出 Excel 或 PDF。</p></div>
  <label class="f">主題<select id="th"><option value="auto">跟隨系統</option><option value="light">淺色模式</option><option value="dark">深色模式</option></select></label>
</header>

<details class="panel" id="d1" open>
  <summary>1. 連線 Trello<span class="sm" id="s1"></span></summary>
  <div class="row2">
    <label class="f">API Key<input type="text" id="key" autocomplete="off"></label>
    <label class="f">Token<input type="password" id="token" autocomplete="off"></label>
    <button id="load">載入看板</button>
  </div>
  <div class="msg" id="m1">要修改日期、成員與留言,Token 需有寫入權限(scope=read,write)。金鑰只存在這個瀏覽器。</div>
</details>

<details class="panel" id="d2" hidden>
  <summary>2. 選擇看板<span class="sm" id="s2"></span></summary>
  <div id="boards"></div>
  <button id="gen">產生甘特圖</button>
  <div class="msg" id="m2"></div>
</details>

<section class="panel" id="p3" hidden>
  <div class="bar-act">
    <div class="row2">
      <label class="f">顯示成員<select id="mf"></select></label>
      <label class="f">時間刻度<select id="sc"><option value="day">日</option><option value="month">月</option><option value="year">年</option></select></label>
      <label class="ck"><input type="checkbox" id="fnd" checked> 顯示無日期卡片</label>
      <label class="ck"><input type="checkbox" id="fnm" checked> 顯示無成員卡片</label>
      <button class="sec" id="tb">今天</button>
      <button class="sec" id="cl">收合全部列表</button><button class="sec" id="ex">展開全部列表</button>
    </div>
    <div class="row2"><button class="sec" id="xl">匯出 Excel</button><button class="sec" id="pdf">匯出 PDF</button></div>
  </div>
  <p class="hint">拖曳色條左右邊緣可調整開始/結束日期,拖曳色條中間可整段移動;在卡片空白處拖曳可新增日期。開啟「顯示列表」時,拖曳卡片左側的 ⋮⋮ 可移到其他列表或調整順序。點列表標題可收合或展開該列表的卡片。</p>
  <div id="gmsg" class="msg"></div>
  <div id="wrap"></div>
  <div class="legend" id="legend"></div>
</section>
<div id="tip"></div><div id="dropline"></div>

<dialog id="dlg">
  <div class="dh"><b id="dt"></b><button class="x" id="dx" aria-label="關閉">✕</button></div>
  <div class="sub" id="di"></div>
  <div class="row2">
    <label class="f">開始日期<input type="date" id="ds"></label>
    <label class="f">結束日期<input type="date" id="de"></label>
    <button id="dsave">儲存日期</button>
    <a id="dl" target="_blank" rel="noopener">在 Trello 開啟</a>
  </div>
  <div class="msg" id="dmsg"></div>
  <h3>描述</h3>
  <div class="desc" id="dd"></div>
  <h3>成員</h3>
  <div class="row2" style="align-items:center"><div id="mlist" class="row2" style="align-items:center"></div><select id="madd"></select></div>
  <div class="msg" id="mmsg"></div>
  <h3>留言</h3>
  <div id="cm"></div>
  <textarea id="nc" placeholder="輸入新留言…"></textarea>
  <div class="row2" style="margin-top:8px"><button id="cadd">送出留言</button><span class="msg" id="cmsg" style="margin:0"></span></div>
</dialog>

<script>
const $=id=>document.getElementById(id), API='https://api.trello.com/1', TZ=8*3600e3, H=3600e3;
const COLORS=['#1f6f78','#c2562e','#5b6ee1','#7a9a2e','#b0408a','#d19a1c','#3f7fbf','#8a5a44'];
const SCALES={day:26,month:6,year:1.5};
let rows=[],boardsData=[],picked=[],boardMem={},boardLists={},showList={},collapsed=new Set(),me='',cur=null,PPD=26,rng={min:0,max:0,today:0},drag=null;
try{$('key').value=localStorage.getItem('tg_key')||'';$('token').value=localStorage.getItem('tg_token')||''}catch(e){}

const tint=(hex,f)=>{const n=parseInt(hex.slice(1),16),dk=document.documentElement.dataset.theme==='dark',b=dk?[26,33,41]:[255,255,255],k=dk?Math.min(1,f*1.6):f,m=(v,i)=>Math.round(b[i]+(v-b[i])*k);return `rgb(${m(n>>16,0)},${m(n>>8&255,1)},${m(n&255,2)})`};
const nowIso=()=>new Date().toISOString();
const dayOf=iso=>Math.floor((new Date(iso).getTime()+TZ)/864e5);
const fmt=d=>new Date(d*864e5).toISOString().slice(0,10);
const msOfDay=(iso,def)=>iso?((new Date(iso).getTime()+TZ)%864e5):def;
const mkIso=(str,ms)=>new Date(Date.parse(str+'T00:00:00Z')+ms-TZ).toISOString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=iso=>new Date(iso).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
const wErr=e=>(e.status===401||e.status===403)?'權限不足:請用 scope=read,write 重新產生 Token。':'失敗:'+e.message;
const say=(t,c='')=>{const m=$('gmsg');m.className='msg '+c;m.textContent=t};

async function api(path,params={},method='GET'){
  const q=new URLSearchParams({...params,key:$('key').value.trim(),token:$('token').value.trim()});
  const r=await fetch(`${API}${path}?${q}`,{method});
  if(!r.ok){const e=new Error(`Trello ${r.status} ${(await r.text()).slice(0,60)}`);e.status=r.status;throw e}
  return r.json();
}
function setDates(r){
  r.hasStart=!!r.startIso;r.hasDue=!!r.dueIso;
  if(!r.startIso&&!r.dueIso){r.s=r.e=null;return}
  const s=dayOf(r.startIso||r.dueIso),e=dayOf(r.dueIso||r.startIso);r.s=Math.min(s,e);r.e=Math.max(s,e);
}
const vis=()=>{
  const f=$('mf').value,nd=$('fnd').checked,nm=$('fnm').checked;
  return rows.filter(r=>(nd||r.s!=null)&&(nm||r.members.length)&&(!f||(f==='__none'?!r.members.length:r.members.some(m=>m.name===f))));
};

/* ---- 連線與讀取 ---- */
$('load').onclick=async()=>{
  $('m1').className='msg';$('m1').textContent='讀取中…';
  try{
    const [bs,m]=await Promise.all([api('/members/me/boards',{fields:'name,closed'}),api('/members/me',{fields:'id'})]);
    me=m.id;boardsData=bs.filter(b=>!b.closed);
    try{localStorage.setItem('tg_key',$('key').value.trim());localStorage.setItem('tg_token',$('token').value.trim())}catch(e){}
    $('boards').innerHTML=boardsData.map((b,i)=>`<label><input type="checkbox" value="${i}"> ${esc(b.name)}</label>`).join('');
    $('d2').hidden=false;$('d2').open=true;$('d1').open=false;$('s1').textContent=`已連線 · ${boardsData.length} 個看板`;
  }catch(e){$('m1').className='msg err';$('m1').textContent='無法載入看板,請確認 API Key 與 Token。'+e.message}
};

$('gen').onclick=async()=>{
  picked=[...document.querySelectorAll('#boards input:checked')].map(i=>boardsData[+i.value]);
  if(!picked.length){$('m2').className='msg err';$('m2').textContent='請至少勾選一個看板。';return}
  $('m2').className='msg';$('m2').textContent='讀取卡片中…';
  rows=[];boardMem={};boardLists={};showList={};collapsed.clear();
  try{
    for(const [bi,b] of picked.entries()){
      const [cards,lists,mems]=await Promise.all([
        api(`/boards/${b.id}/cards`,{fields:'name,start,due,dueComplete,idList,url,pos,desc',members:'true',member_fields:'fullName'}),
        api(`/boards/${b.id}/lists`,{fields:'name'}),
        api(`/boards/${b.id}/members`,{fields:'fullName'})]);
      boardLists[bi]=lists;boardMem[bi]=mems;showList[bi]=true;
      const ln=Object.fromEntries(lists.map(l=>[l.id,l.name]));
      for(const c of cards){
        const r={id:c.id,board:b.name,bi,idList:c.idList,list:ln[c.idList]||'(其他)',name:c.name,pos:c.pos,desc:c.desc||'',startIso:c.start,dueIso:c.due,
          done:!!c.dueComplete,members:(c.members||[]).map(m=>({id:m.id,name:m.fullName})),url:c.url};
        setDates(r);rows.push(r);
      }
      await new Promise(r=>setTimeout(r,150));
    }
    rows.forEach((r,i)=>r.i=i);
    const names=[...new Set(Object.values(boardMem).flat().map(m=>m.fullName))].sort();
    $('mf').innerHTML='<option value="">全部成員</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')+'<option value="__none">未指派</option>';
    $('s2').textContent=`已選 ${picked.length} 個看板 · ${rows.length} 張卡片(${rows.filter(r=>r.s==null).length} 張無日期)`;
    $('m2').textContent='';
    if(rows.length){$('p3').hidden=false;draw(false);$('d2').open=false}else{$('m2').textContent='所選看板沒有卡片。'}
  }catch(e){$('m2').className='msg err';$('m2').textContent='讀取卡片失敗。'+e.message}
};
['mf','fnd','fnm'].forEach(id=>$(id).onchange=()=>draw(true));
$('sc').onchange=()=>{PPD=SCALES[$('sc').value];draw(false)};
const goToday=()=>{$('wrap').scrollLeft=(rng.today-rng.min)*PPD};
$('tb').onclick=goToday;
$('cl').onclick=()=>{picked.forEach((b,bi)=>{if(!showList[bi])return;boardLists[bi].forEach(l=>collapsed.add(`${bi}:${l.id}`));collapsed.add(`${bi}:_`)});draw(true)};
$('ex').onclick=()=>{collapsed.clear();draw(true)};

/* ---- 主題 ---- */
function applyTheme(p){
  try{localStorage.setItem('tg_theme',p)}catch(e){}
  document.documentElement.dataset.theme=p==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):p;
  if(rows.length&&!$('p3').hidden)draw(true);
}
try{$('th').value=localStorage.getItem('tg_theme')||'auto'}catch(e){}
$('th').onchange=()=>applyTheme($('th').value);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if($('th').value==='auto')applyTheme('auto')});

/* ---- 繪製 ---- */
function cells(unit,label,left){
  let o='',d=rng.min;
  while(d<=rng.max){
    const dt=new Date(d*864e5),y=dt.getUTCFullYear(),m=dt.getUTCMonth();
    const nx=(unit==='y'?Date.UTC(y+1,0,1):Date.UTC(y,m+1,1))/864e5,e=Math.min(nx-1,rng.max);
    o+=`<div class="cell" style="left:${(d-rng.min)*PPD}px;width:${(e-d+1)*PPD}px;${left?'text-align:left;padding-left:4px':''}">${label(y,m)}</div>`;d=nx;
  }
  return o;
}
function draw(keep){
  const w=$('wrap'),sl=w.scrollLeft,st=w.scrollTop,V=vis(),today=dayOf(nowIso());
  if(!V.length){w.innerHTML='<div class="msg" style="padding:16px">沒有符合條件的卡片。</div>';$('legend').innerHTML='';return}
  const dated=V.filter(r=>r.s!=null);
  const lo=Math.min(today,...dated.map(r=>r.s)),hi=Math.max(today,...dated.map(r=>r.e));
  rng={min:lo-3,max:Math.max(hi+3,today+Math.ceil(2000/PPD)),today};
  const W=(rng.max-rng.min+1)*PPD;
  let top,bot='';
  if(PPD===26){
    top=cells('m',(y,m)=>`${y}/${m+1}`,1);
    for(let d=rng.min;d<=rng.max;d++){const dt=new Date(d*864e5);
      bot+=`<div class="cell ${[0,6].includes(dt.getUTCDay())?'wk':''}" style="left:${(d-rng.min)*PPD}px;width:${PPD}px">${dt.getUTCDate()}</div>`}
  }else{top=cells('y',y=>y,1);bot=cells('m',(y,m)=>PPD>=6?`${m+1}月`:`${m+1}`)}
  const x=(today-rng.min)*PPD+PPD/2;
  const tl=`<div class="today" style="left:${x}px"></div>`;
  const bg=PPD===26?`background-image:repeating-linear-gradient(90deg,transparent 0 ${PPD-1}px,var(--grid) ${PPD-1}px ${PPD}px)`:'';
  const tr=`class="track" style="width:${W}px"`;
  let h=`<div class="g"><div class="r hd"><div class="lab">卡片 / 成員</div><div ${tr}>${top}<div class="tbadge" data-today style="left:${x}px">今天</div></div></div>
  <div class="r hd"><div class="lab"></div><div ${tr}>${bot}</div></div>`;
  const cardRow=(r,bi,grp)=>{
    const mem=r.members.map(m=>m.name).join('、'),tip=`${r.name}\n${r.s==null?'無日期':fmt(r.s)+' ~ '+fmt(r.e)}\n${mem||'無成員'}`;
    const late=!r.done&&r.hasDue&&r.e<today;
    const bar=r.s==null?'':`<div class="bar ${r.done?'done':''} ${late?'late':''}" style="left:${(r.s-rng.min)*PPD}px;width:${(r.e-r.s+1)*PPD}px;background:${COLORS[bi%COLORS.length]}"></div>`;
    const c0=COLORS[bi%COLORS.length];
    return `<div class="r ${grp?'cr':''}" data-ri="${r.i}" data-bi="${bi}" style="--bt:${tint(c0,.45)}"><div class="lab" data-i="${r.i}" title="${esc(tip)}">${grp?`<span class="gp" data-gp="${r.i}" title="拖曳以移動或排序">⋮⋮</span>`:''}<span class="n">${esc(r.name)}</span>${grp?'':`<span class="lchip" title="${esc(r.list)}">${esc(r.list)}</span>`}
      <span class="mm">${r.members.map(m=>`<span class="chip">${esc(m.name)}</span>`).join('')}</span></div>
      <div class="track" data-ti="${r.i}" style="width:${W}px;${bg}">${tl}${bar}</div></div>`;
  };
  const cmp=(a,b)=>(a.s??1e9)-(b.s??1e9)||(a.e??1e9)-(b.e??1e9);
  picked.forEach((b,bi)=>{
    const bl=V.filter(r=>r.bi===bi);if(!bl.length)return;
    h+=`<div class="r bd"><div class="lab"><span class="n">${esc(b.name)}</span><label class="lt"><input type="checkbox" data-bl="${bi}" ${showList[bi]?'checked':''}> 顯示列表</label></div><div ${tr}></div></div>`;
    if(showList[bi]){
      const known=new Set(boardLists[bi].map(l=>l.id));
      const groups=boardLists[bi].map(l=>({id:l.id,name:l.name,rs:bl.filter(r=>r.idList===l.id)}));
      const oth=bl.filter(r=>!known.has(r.idList));if(oth.length)groups.push({id:'',name:'(其他)',rs:oth});
      const c=COLORS[bi%COLORS.length],bgc=tint(c,.14);
      groups.forEach(g=>{
        const key=`${bi}:${g.id||'_'}`,off=collapsed.has(key),tot=rows.filter(r=>r.bi===bi&&(g.id?r.idList===g.id:!known.has(r.idList))).length,cnt=g.rs.length+(tot!==g.rs.length?' / '+tot:'');
        h+=`<div class="r lr" data-lid="${g.id}" data-bi="${bi}" data-key="${key}" title="點擊${off?'展開':'收合'}" style="--bc:${c};background:${bgc}"><div class="lab" style="background:${bgc}"><span class="arr">${off?'▶':'▼'}</span><span class="ltag">列表</span><span class="n">${esc(g.name)}</span><span class="cnt" title="顯示中的卡片數(有篩選時為「顯示中 / 列表總數」)">${cnt}</span></div><div ${tr}></div></div>`;
        if(!off)g.rs.sort((a,b)=>a.pos-b.pos).forEach(r=>h+=cardRow(r,bi,true))});
    }else bl.sort(cmp).forEach(r=>h+=cardRow(r,bi,false));
  });
  w.innerHTML=h+'</div>';
  $('legend').innerHTML=picked.map((b,i)=>`<span><i style="background:${COLORS[i%COLORS.length]}"></i>${esc(b.name)}</span>`).join('')
   +'<span><i style="background:#999;opacity:.4"></i>已完成</span><span><i style="outline:2px solid var(--late);background:var(--card)"></i>已逾期</span><span><i style="background:#e8a33d"></i>今天</span>';
  if(keep){w.scrollLeft=sl;w.scrollTop=st}else{goToday();w.scrollTop=0}
}
$('wrap').onclick=e=>{
  if(e.target.closest('[data-today]')){goToday();return}
  if(e.target.closest('[data-gp]'))return;
  const lr=e.target.closest('.lr[data-key]');
  if(lr){const k=lr.dataset.key;collapsed.has(k)?collapsed.delete(k):collapsed.add(k);draw(true);return}
  const t=e.target.closest('.lab[data-i]');if(t)openCard(+t.dataset.i);
};
$('wrap').onchange=e=>{const t=e.target.closest('[data-bl]');if(t){showList[+t.dataset.bl]=t.checked;draw(true)}};

/* ---- 在圖上拖曳日期 ---- */
$('wrap').addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const tr=e.target.closest('.track[data-ti]');if(!tr)return;
  const r=rows[+tr.dataset.ti],bar=e.target.closest('.bar'),tx=tr.getBoundingClientRect().left;
  let mode='new';
  if(bar){const ox=e.clientX-bar.getBoundingClientRect().left;mode=ox<8?'l':ox>bar.offsetWidth-8?'r':'m'}
  drag={r,tr,bar,mode,x0:e.clientX,tx,s0:r.s,e0:r.e,ns:r.s,ne:r.e,moved:false,a:rng.min+Math.floor((e.clientX-tx)/PPD)};
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  const d=drag;if(!d)return;
  if(Math.abs(e.clientX-d.x0)>3)d.moved=true;if(!d.moved)return;
  const dd=Math.round((e.clientX-d.x0)/PPD);
  if(d.mode==='new'){const b=rng.min+Math.floor((e.clientX-d.tx)/PPD);d.ns=Math.min(d.a,b);d.ne=Math.max(d.a,b)}
  else if(d.mode==='l'){d.ns=Math.min(d.s0+dd,d.e0);d.ne=d.e0}
  else if(d.mode==='r'){d.ns=d.s0;d.ne=Math.max(d.e0+dd,d.s0)}
  else{d.ns=d.s0+dd;d.ne=d.e0+dd}
  let g=d.bar||d.ghost;
  if(!g){g=d.ghost=document.createElement('div');g.className='bar';g.style.background=COLORS[d.r.bi%COLORS.length];d.tr.appendChild(g)}
  g.style.left=(d.ns-rng.min)*PPD+'px';g.style.width=(d.ne-d.ns+1)*PPD+'px';
  const t=$('tip');t.style.display='block';t.style.left=e.clientX+12+'px';t.style.top=e.clientY+12+'px';t.textContent=`${fmt(d.ns)} ~ ${fmt(d.ne)}`;
});
document.addEventListener('pointerup',()=>{
  const d=drag;if(!d)return;drag=null;$('tip').style.display='none';
  if(!d.moved){if(d.bar)openCard(d.r.i);return}
  if(d.ns===d.s0&&d.ne===d.e0){draw(true);return}
  saveRange(d.r,d.ns,d.ne);
});
async function saveRange(r,ns,ne){
  const old={startIso:r.startIso,dueIso:r.dueIso};
  let sm=msOfDay(old.startIso,9*H),dm=msOfDay(old.dueIso,18*H);
  if(ns===ne&&sm>dm)sm=Math.max(0,dm-H);
  r.startIso=mkIso(fmt(ns),sm);r.dueIso=mkIso(fmt(ne),dm);setDates(r);draw(true);say('儲存中…');
  try{await api(`/cards/${r.id}`,{start:r.startIso,due:r.dueIso},'PUT');say(`已更新「${r.name}」:${fmt(ns)} ~ ${fmt(ne)}`,'ok')}
  catch(e){Object.assign(r,old);setDates(r);draw(true);say(wErr(e),'err')}
}

/* ---- 拖曳卡片:換列表 / 排序 ---- */
let cd=null;
$('wrap').addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-gp]');if(!g||e.button!==0)return;
  cd={r:rows[+g.dataset.gp],t:null,moved:false,x0:e.clientX,y0:e.clientY};e.preventDefault();
});
function findTarget(e){
  const el=document.elementFromPoint(e.clientX,e.clientY),row=el&&el.closest('.r[data-ri],.r[data-lid]');
  if(!row||+row.dataset.bi!==cd.r.bi)return null;
  const rc=row.getBoundingClientRect();
  if(row.dataset.lid!==undefined){return row.dataset.lid?{lid:row.dataset.lid,ref:null,after:false,y:rc.bottom}:null}
  const ref=rows[+row.dataset.ri];if(ref===cd.r)return null;
  const after=e.clientY>rc.top+rc.height/2;
  return {lid:ref.idList,ref,after,y:after?rc.bottom:rc.top};
}
document.addEventListener('pointermove',e=>{
  if(!cd)return;
  if(Math.abs(e.clientY-cd.y0)+Math.abs(e.clientX-cd.x0)>4)cd.moved=true;if(!cd.moved)return;
  const w=$('wrap'),wr=w.getBoundingClientRect(),t=$('tip'),dl=$('dropline');
  if(e.clientY<wr.top+36)w.scrollTop-=14;else if(e.clientY>wr.bottom-36)w.scrollTop+=14;
  cd.t=findTarget(e);
  t.style.display='block';t.style.left=e.clientX+12+'px';t.style.top=e.clientY+12+'px';t.textContent=cd.r.name;
  if(cd.t){dl.style.display='block';dl.style.left=wr.left+'px';dl.style.width=wr.width+'px';dl.style.top=cd.t.y-1+'px'}else dl.style.display='none';
});
document.addEventListener('pointerup',()=>{
  const d=cd;if(!d)return;cd=null;$('tip').style.display='none';$('dropline').style.display='none';
  if(d.moved&&d.t)moveCard(d.r,d.t);
});
async function moveCard(r,t){
  const L=rows.filter(x=>x.bi===r.bi&&x.idList===t.lid&&x!==r).sort((a,b)=>a.pos-b.pos);
  let pos;
  if(!t.ref)pos=L.length?L[0].pos/2:65536;
  else{const i=L.indexOf(t.ref);
    pos=t.after?(L[i+1]?(t.ref.pos+L[i+1].pos)/2:t.ref.pos+65536):(L[i-1]?(L[i-1].pos+t.ref.pos)/2:t.ref.pos/2)}
  const old={idList:r.idList,list:r.list,pos:r.pos},ln=boardLists[r.bi].find(l=>l.id===t.lid).name;
  r.idList=t.lid;r.list=ln;r.pos=pos;draw(true);say('移動中…');
  try{await api(`/cards/${r.id}`,{idList:t.lid,pos},'PUT');say(`已將「${r.name}」移到「${ln}」`,'ok')}
  catch(e){Object.assign(r,old);draw(true);say(wErr(e),'err')}
}

/* ---- 卡片視窗 ---- */
function renderMem(){
  $('mlist').innerHTML=cur.members.map(m=>`<span class="chip">${esc(m.name)} <button class="lk" data-rm="${m.id}" aria-label="移除 ${esc(m.name)}">✕</button></span>`).join('')||'<span class="msg" style="margin:0">無成員</span>';
  const av=(boardMem[cur.bi]||[]).filter(m=>!cur.members.some(x=>x.id===m.id));
  $('madd').innerHTML='<option value="">+ 新增成員…</option>'+av.map(m=>`<option value="${m.id}">${esc(m.fullName)}</option>`).join('');
}
function openCard(i){
  cur=rows[i];$('dt').textContent=cur.name;$('di').textContent=`${cur.board} › ${cur.list}`;
  $('ds').value=cur.startIso?fmt(dayOf(cur.startIso)):'';$('de').value=cur.dueIso?fmt(dayOf(cur.dueIso)):'';
  $('dl').href=cur.url;$('dd').textContent=cur.desc||'(無描述)';$('dmsg').textContent='';$('mmsg').textContent='';$('cmsg').textContent='';$('nc').value='';
  renderMem();$('dlg').showModal();loadComments();
}
$('dx').onclick=()=>$('dlg').close();
$('dsave').onclick=async()=>{
  const s=$('ds').value,d=$('de').value,m=$('dmsg');m.className='msg';
  if(s&&d&&s>d){m.className='msg err';m.textContent='開始日期不能晚於結束日期。';return}
  const sIso=s?mkIso(s,msOfDay(cur.startIso,9*H)):null,dIso=d?mkIso(d,msOfDay(cur.dueIso,18*H)):null;
  m.textContent='儲存中…';
  try{
    await api(`/cards/${cur.id}`,{start:sIso??'null',due:dIso??'null'},'PUT');
    cur.startIso=sIso;cur.dueIso=dIso;setDates(cur);draw(true);m.className='msg ok';m.textContent='已儲存。';
  }catch(e){m.className='msg err';m.textContent=wErr(e)}
};
$('madd').onchange=async()=>{
  const id=$('madd').value,m=$('mmsg');if(!id)return;m.className='msg';m.textContent='新增中…';
  try{
    await api(`/cards/${cur.id}/idMembers`,{value:id},'POST');
    const p=boardMem[cur.bi].find(x=>x.id===id);cur.members.push({id,name:p.fullName});
    renderMem();draw(true);m.textContent='';
  }catch(e){m.className='msg err';m.textContent=wErr(e);renderMem()}
};
$('mlist').onclick=async e=>{
  const b=e.target.closest('[data-rm]');if(!b)return;const m=$('mmsg');m.className='msg';m.textContent='移除中…';
  try{
    await api(`/cards/${cur.id}/idMembers/${b.dataset.rm}`,{},'DELETE');
    cur.members=cur.members.filter(x=>x.id!==b.dataset.rm);renderMem();draw(true);m.textContent='';
  }catch(err){m.className='msg err';m.textContent=wErr(err)}
};
async function loadComments(){
  const box=$('cm');box.textContent='載入中…';
  try{
    const a=await api(`/cards/${cur.id}/actions`,{filter:'commentCard'});
    box.innerHTML=a.map(x=>`<div class="c" data-id="${x.id}"><div class="ch"><b>${esc(x.memberCreator?.fullName||'')}</b> · ${when(x.date)}
      ${x.idMemberCreator===me?'<button class="lk" data-act="edit">編輯</button>':''}</div><div class="ct">${esc(x.data.text)}</div></div>`).join('')||'<div class="msg">尚無留言</div>';
  }catch(e){box.innerHTML=`<div class="msg err">${esc('留言讀取失敗。'+e.message)}</div>`}
}
$('cm').onclick=async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const c=b.closest('.c'),ct=c.querySelector('.ct');
  if(b.dataset.act==='edit'){
    const t=ct.textContent;ct.innerHTML='<textarea></textarea><div class="row2" style="margin-top:6px"><button data-act="save">儲存</button><button class="sec" data-act="cancel">取消</button></div>';
    ct.querySelector('textarea').value=t;
  }else if(b.dataset.act==='cancel'){loadComments()}
  else if(b.dataset.act==='save'){
    const text=ct.querySelector('textarea').value.trim();if(!text)return;
    try{await api(`/cards/${cur.id}/actions/${c.dataset.id}/comments`,{text},'PUT');loadComments()}
    catch(err){alert(wErr(err))}
  }
};
$('cadd').onclick=async()=>{
  const text=$('nc').value.trim(),m=$('cmsg');if(!text)return;
  m.className='msg';m.textContent='送出中…';
  try{await api(`/cards/${cur.id}/actions/comments`,{text},'POST');$('nc').value='';m.textContent='';loadComments()}
  catch(e){m.className='msg err';m.textContent=wErr(e)}
};

/* ---- 匯出 ---- */
$('xl').onclick=()=>{
  const data=vis().map(r=>({看板:r.board,列表:r.list,卡片:r.name,開始日期:r.hasStart?fmt(dayOf(r.startIso)):'',結束日期:r.hasDue?fmt(dayOf(r.dueIso)):'',
    天數:r.s==null?'':r.e-r.s+1,已完成:r.done?'是':'否',成員:r.members.map(m=>m.name).join('、'),連結:r.url}));
  const ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[18,14,36,12,12,6,8,24,40].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'卡片排程');
  XLSX.writeFile(wb,`trello-gantt-${fmt(dayOf(nowIso()))}.xlsx`);
};
$('pdf').onclick=async()=>{
  const btn=$('pdf');btn.disabled=true;btn.textContent='產生中…';
  const w=$('wrap'),prev=document.documentElement.dataset.theme;
  if(prev==='dark'){document.documentElement.dataset.theme='light';draw(true)}
  w.classList.add('exporting');
  try{
    const el=w.firstElementChild;
    const cv=await html2canvas(el,{scale:1.5,backgroundColor:'#fff',width:el.scrollWidth,windowWidth:el.scrollWidth+50});
    const {jsPDF}=window.jspdf,pdf=new jsPDF('l','pt','a3');
    const PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight(),M=24;
    const k=(PW-2*M)/cv.width,sliceH=Math.floor((PH-2*M)/k);
    for(let y=0,p=0;y<cv.height;y+=sliceH,p++){
      const h=Math.min(sliceH,cv.height-y),part=document.createElement('canvas');
      part.width=cv.width;part.height=h;part.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(p)pdf.addPage();
      pdf.addImage(part.toDataURL('image/png'),'PNG',M,M,cv.width*k,h*k);
    }
    pdf.save(`trello-gantt-${fmt(dayOf(nowIso()))}.pdf`);
  }catch(e){alert('PDF 匯出失敗:'+e.message)}
  finally{w.classList.remove('exporting');if(prev==='dark'){document.documentElement.dataset.theme='dark';draw(true)}btn.disabled=false;btn.textContent='匯出 PDF'}
};
</script>
